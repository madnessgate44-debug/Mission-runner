<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mission Runner · Self-Updater</title>
  <style>
    body {
      font-family: system-ui, -apple-system, sans-serif;
      max-width: 700px;
      margin: 2rem auto;
      padding: 1rem;
      background: #f4f6fa;
    }
    .card {
      background: white;
      border-radius: 20px;
      padding: 1.5rem;
      margin-bottom: 1.5rem;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
    }
    h1 {
      font-size: 1.5rem;
      margin-bottom: 0.5rem;
    }
    textarea {
      width: 100%;
      font-family: monospace;
      font-size: 13px;
      padding: 10px;
      border: 1px solid #ccc;
      border-radius: 12px;
      margin: 10px 0;
      box-sizing: border-box;
    }
    input, button {
      padding: 10px;
      font-size: 14px;
      border-radius: 30px;
      border: 1px solid #ccc;
    }
    button {
      background: #3b82f6;
      color: white;
      border: none;
      cursor: pointer;
      font-weight: 600;
      margin-right: 8px;
    }
    button:hover {
      background: #2563eb;
    }
    .status {
      background: #e2e8f0;
      padding: 12px;
      border-radius: 12px;
      font-family: monospace;
      font-size: 12px;
      white-space: pre-wrap;
      margin-top: 12px;
    }
    .error {
      background: #fee2e2;
      color: #b91c1c;
    }
    .success {
      background: #dcfce7;
      color: #166534;
    }
    hr {
      margin: 20px 0;
    }
  </style>
</head>
<body>
<div class="card">
  <h1>🔄 Mission Runner · Self-Updater</h1>
  <p>This tool updates <strong>index.html</strong> on GitHub directly. No AI, no sidebars — just self-update.</p>
  <hr>
  <label><strong>1. GitHub Token (needs 'repo' scope)</strong></label>
  <input type="password" id="tokenInput" placeholder="ghp_xxxxxxxxxxxx" style="width:100%; margin:8px 0;">
  <button id="saveTokenBtn">💾 Save Token (localStorage)</button>
  <button id="clearTokenBtn">🗑 Clear Token</button>

  <hr>
  <label><strong>2. New HTML code for index.html</strong></label>
  <textarea id="newHtml" rows="12" placeholder='Paste the full HTML code here. Must start with "<!DOCTYPE html>" and end with "</html>"'></textarea>

  <button id="updateBtn" style="width:100%; margin:8px 0;">🚀 Commit to GitHub (main branch)</button>

  <div id="status" class="status">Ready. Enter token and paste new HTML, then click commit.</div>
</div>

<script>
  // GitHub repo info
  const owner = 'madnessgate44-debug';
  const repo = 'Mission-runner';
  const path = 'index.html';
  const branch = 'main';

  // DOM elements
  const tokenInput = document.getElementById('tokenInput');
  const saveTokenBtn = document.getElementById('saveTokenBtn');
  const clearTokenBtn = document.getElementById('clearTokenBtn');
  const newHtmlTextarea = document.getElementById('newHtml');
  const updateBtn = document.getElementById('updateBtn');
  const statusDiv = document.getElementById('status');

  // Load saved token from localStorage
  const savedToken = localStorage.getItem('github_token');
  if (savedToken) {
    tokenInput.value = savedToken;
    statusDiv.innerHTML = '✅ Token loaded from storage. Paste new HTML and click commit.';
  }

  // Save token
  saveTokenBtn.onclick = () => {
    const token = tokenInput.value.trim();
    if (token.length < 10) {
      statusDiv.innerHTML = '❌ Invalid token (too short).';
      return;
    }
    localStorage.setItem('github_token', token);
    statusDiv.innerHTML = '✅ Token saved to localStorage.';
  };

  // Clear token
  clearTokenBtn.onclick = () => {
    localStorage.removeItem('github_token');
    tokenInput.value = '';
    statusDiv.innerHTML = '🗑 Token cleared.';
  };

  // Helper to show status
  function setStatus(text, isError = false) {
    statusDiv.innerHTML = text;
    statusDiv.className = `status ${isError ? 'error' : 'success'}`;
    setTimeout(() => {
      if (!isError) statusDiv.className = 'status';
    }, 4000);
  }

  // Update file on GitHub
  async function updateGitHubFile(content, token) {
    // First, get the current file's SHA
    const url = `https://api.github.com/repos/${owner}/${repo}/contents/${path}`;
    const getResponse = await fetch(url, {
      headers: {
        'Authorization': `token ${token}`,
        'Accept': 'application/vnd.github.v3+json'
      }
    });

    let sha = null;
    if (getResponse.ok) {
      const data = await getResponse.json();
      sha = data.sha;
    } else if (getResponse.status !== 404) {
      throw new Error(`Failed to get file info: ${getResponse.status}`);
    }

    // Prepare commit
    const contentBase64 = btoa(unescape(encodeURIComponent(content))); // handle UTF-8
    const payload = {
      message: 'Self-update via Mission Runner',
      content: contentBase64,
      branch: branch
    };
    if (sha) payload.sha = sha;

    const putResponse = await fetch(url, {
      method: 'PUT',
      headers: {
        'Authorization': `token ${token}`,
        'Content-Type': 'application/json',
        'Accept': 'application/vnd.github.v3+json'
      },
      body: JSON.stringify(payload)
    });

    if (!putResponse.ok) {
      const errData = await putResponse.json();
      throw new Error(`GitHub API error: ${errData.message || putResponse.status}`);
    }
    return await putResponse.json();
  }

  // Commit button
  updateBtn.onclick = async () => {
    const token = tokenInput.value.trim();
    if (!token) {
      setStatus('❌ Please enter your GitHub token.', true);
      return;
    }
    const newHtml = newHtmlTextarea.value;
    if (!newHtml.trim()) {
      setStatus('❌ Please paste new HTML code.', true);
      return;
    }
    if (!newHtml.includes('<!DOCTYPE html>') || !newHtml.includes('</html>')) {
      setStatus('❌ HTML seems invalid (missing <!DOCTYPE html> or </html>)', true);
      return;
    }

    setStatus('⏳ Updating index.html on GitHub...', false);
    try {
      const result = await updateGitHubFile(newHtml, token);
      setStatus(`✅ Success! Commit: ${result.commit.sha.substring(0,7)}. Page will auto-reload in 5 seconds.`);
      // Optional: reload after 5 seconds to see the new version
      setTimeout(() => {
        location.reload();
      }, 5000);
    } catch (err) {
      setStatus(`❌ Failed: ${err.message}`, true);
    }
  };

  // Pre-fill a demo minimal HTML as example (optional)
  const demoHtml = `<!DOCTYPE html>
<html>
<head><meta charset="UTF-8"><title>Mission Runner - Minimal</title></head>
<body>
<h1>Mission Runner v1.0</h1>
<p>Self-updater installed successfully.</p>
<button onclick="alert('Hello')">Test</button>
</body>
</html>`;
  newHtmlTextarea.placeholder = `Example:\n${demoHtml}`;
</script>
</body>
</html>
