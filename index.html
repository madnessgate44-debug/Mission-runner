<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mission Runner · Auto-Fix</title>
  <style>
    *{margin:0;padding:0;box-sizing:border-box;}
    body{font-family:system-ui;background:#f4f6fa;height:100vh;display:flex;flex-direction:column;}
    .header{display:flex;align-items:center;gap:12px;padding:12px 20px;background:white;border-bottom:1px solid #ddd;}
    .title{font-weight:600;flex:1;}
    .conversation{flex:1;overflow-y:auto;padding:20px;display:flex;flex-direction:column;gap:12px;}
    .message{padding:10px 16px;border-radius:20px;max-width:80%;}
    .user{background:#3b82f6;color:white;align-self:flex-end;}
    .ai{background:#f1f5f9;align-self:flex-start;}
    .input-bar{display:flex;gap:12px;padding:12px 20px;background:white;border-top:1px solid #ddd;}
    .input-field{flex:1;padding:10px;border-radius:40px;border:1px solid #ccc;}
    .send-btn{background:#3b82f6;color:white;border:none;padding:8px 20px;border-radius:40px;cursor:pointer;}
    .sidebar{position:fixed;top:0;left:-280px;width:280px;height:100%;background:#0f172a;color:white;transition:left 0.2s;z-index:1000;padding:20px;}
    .sidebar.open{left:0;}
    .overlay{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,0.5);z-index:999;display:none;}
    .overlay.open{display:block;}
    .sidebar button{display:block;width:100%;margin:8px 0;padding:8px;background:#1e293b;border:none;color:white;border-radius:12px;cursor:pointer;}
    .token-input{width:100%;padding:6px;margin-bottom:12px;border-radius:20px;border:none;}
  </style>
</head>
<body>
<div class="overlay" id="overlay"></div>
<div class="sidebar" id="sidebar">
  <h3>⚙️ Mission Runner</h3>
  <input type="password" id="tokenInput" class="token-input" placeholder="GitHub token (repo + pages:write)">
  <button id="saveTokenBtn">💾 Save Token</button>
  <button id="fixPagesBtn">🔧 Fix GitHub Pages (Auto)</button>
  <button id="closeSidebarBtn">✖ Close</button>
</div>
<div class="main" style="flex:1;display:flex;flex-direction:column;">
  <div class="header">
    <button id="menuBtn" style="background:none;font-size:24px;">☰</button>
    <div class="title">Mission Runner · Auto-Fix</div>
  </div>
  <div class="conversation" id="conversation">
    <div class="message ai">✅ Ready. Open sidebar, paste your GitHub token (repo + pages:write), then click "Fix GitHub Pages".</div>
  </div>
  <div class="input-bar">
    <input class="input-field" id="messageInput" placeholder="Ask or paste ```action-steps...">
    <button class="send-btn" id="sendBtn">Send</button>
  </div>
</div>

<script>
  const owner = "madnessgate44-debug";
  const repo = "Mission-runner";
  let githubToken = "";

  // DOM elements
  const conversation = document.getElementById("conversation");
  const messageInput = document.getElementById("messageInput");
  const sendBtn = document.getElementById("sendBtn");
  const menuBtn = document.getElementById("menuBtn");
  const sidebar = document.getElementById("sidebar");
  const overlay = document.getElementById("overlay");
  const tokenInput = document.getElementById("tokenInput");
  const saveTokenBtn = document.getElementById("saveTokenBtn");
  const fixPagesBtn = document.getElementById("fixPagesBtn");
  const closeSidebarBtn = document.getElementById("closeSidebarBtn");

  // Helper: add message
  function addMessage(text, sender) {
    const div = document.createElement("div");
    div.className = `message ${sender === "user" ? "user" : "ai"}`;
    div.innerHTML = text.replace(/\n/g, "<br>");
    conversation.appendChild(div);
    div.scrollIntoView();
  }

  // Sidebar logic
  function openSidebar() { sidebar.classList.add("open"); overlay.classList.add("open"); }
  function closeSidebar() { sidebar.classList.remove("open"); overlay.classList.remove("open"); }
  menuBtn.onclick = openSidebar;
  overlay.onclick = closeSidebar;
  closeSidebarBtn.onclick = closeSidebar;

  // Token storage
  const savedToken = localStorage.getItem("github_token");
  if (savedToken) {
    tokenInput.value = savedToken;
    githubToken = savedToken;
  }
  saveTokenBtn.onclick = () => {
    const token = tokenInput.value.trim();
    if (token.length < 10) { addMessage("❌ Invalid token", "ai"); return; }
    localStorage.setItem("github_token", token);
    githubToken = token;
    addMessage("✅ Token saved", "ai");
    closeSidebar();
  };

  // Helper: GitHub API request
  async function githubRequest(endpoint, method, body = null) {
    const url = `https://api.github.com/repos/${owner}/${repo}${endpoint}`;
    const headers = { Authorization: `token ${githubToken}`, Accept: "application/vnd.github.v3+json" };
    if (body) headers["Content-Type"] = "application/json";
    const res = await fetch(url, { method, headers, body: body ? JSON.stringify(body) : undefined });
    if (!res.ok) throw new Error(await res.text());
    return res.json();
  }

  // 1. Create .github/workflows/deploy.yml
  async function createWorkflow() {
    const workflowContent = `name: Deploy to GitHub Pages
on:
  push:
    branches: [ "main" ]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: "pages"
  cancel-in-progress: false
jobs:
  deploy:
    environment:
      name: github-pages
      url: \${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4`;
    const path = ".github/workflows/deploy.yml";
    // Get existing file SHA if any
    let sha = null;
    try {
      const existing = await githubRequest(`/contents/${path}`, "GET");
      sha = existing.sha;
    } catch(e) { /* file doesn't exist */ }
    const contentBase64 = btoa(unescape(encodeURIComponent(workflowContent)));
    await githubRequest(`/contents/${path}`, "PUT", {
      message: "Add GitHub Actions workflow for Pages",
      content: contentBase64,
      sha: sha,
      branch: "main"
    });
  }

  // 2. Ensure Pages source is set to branch (we'll rely on Actions)
  async function configurePages() {
    // Set source to main branch (required for Actions to take over)
    await fetch(`https://api.github.com/repos/${owner}/${repo}/pages`, {
      method: "PATCH",
      headers: { Authorization: `token ${githubToken}`, "Content-Type": "application/json" },
      body: JSON.stringify({ source: { branch: "main", path: "/" } })
    });
    // Trigger a Pages build (optional)
    await fetch(`https://api.github.com/repos/${owner}/${repo}/pages/builds`, {
      method: "POST",
      headers: { Authorization: `token ${githubToken}` }
    });
  }

  // 3. Main fix function
  async function fixGitHubPages() {
    if (!githubToken) {
      addMessage("❌ No GitHub token. Please save your token first.", "ai");
      return;
    }
    addMessage("🔧 Starting auto-fix...", "ai");
    try {
      addMessage("📁 Creating workflow file...", "ai");
      await createWorkflow();
      addMessage("✅ Workflow created.", "ai");
      addMessage("⚙️ Configuring Pages source...", "ai");
      await configurePages();
      addMessage("✅ Pages configured.", "ai");
      addMessage("🔄 Triggering a test commit (updating index.html timestamp)...", "ai");
      // Make a dummy commit to index.html to trigger the workflow
      const currentHtml = document.documentElement.outerHTML;
      const contentBase64 = btoa(unescape(encodeURIComponent(currentHtml)));
      const fileSha = await githubRequest(`/contents/index.html`, "GET").then(d => d.sha);
      await githubRequest(`/contents/index.html`, "PUT", {
        message: "Trigger workflow after Pages fix",
        content: contentBase64,
        sha: fileSha,
        branch: "main"
      });
      addMessage("✅ Test commit made. Watch Actions tab for workflow runs.", "ai");
      addMessage("🎉 Fix complete! GitHub Pages should now deploy via Actions on every commit (including API commits).", "ai");
    } catch (err) {
      addMessage(`❌ Error: ${err.message}`, "ai");
    }
  }

  fixPagesBtn.onclick = () => { closeSidebar(); fixGitHubPages(); };

  // Simple send (placeholder for AI)
  sendBtn.onclick = () => {
    const msg = messageInput.value.trim();
    if (!msg) return;
    addMessage(msg, "user");
    addMessage("Demo reply. Add your API key in a future version.", "ai");
    messageInput.value = "";
  };
  messageInput.addEventListener("keypress", e => { if (e.key === "Enter") sendBtn.click(); });
</script>
</body>
</html>
