<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mission Runner v11 · Stable</title>
  <style>
    *{margin:0;padding:0;box-sizing:border-box;}
    body{font-family:system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;background:#f4f6fa;height:100vh;display:flex;flex-direction:column;}
    #debug{background:#1e1e2f;color:#0f0;font-family:monospace;font-size:11px;padding:4px 8px;max-height:120px;overflow:auto;border-bottom:1px solid #f97316;}
    .app{display:flex;flex:1;position:relative;}
    .sidebar{position:fixed;top:0;left:-280px;width:280px;height:100%;background:#0f172a;color:#e2e8f0;transition:left 0.2s;z-index:1000;padding:20px;display:flex;flex-direction:column;gap:8px;overflow-y:auto;}
    .sidebar.open{left:0;}
    .overlay{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,0.5);z-index:999;display:none;}
    .overlay.open{display:block;}
    .sidebar button{background:#1e293b;border:none;color:white;padding:10px;border-radius:12px;text-align:left;cursor:pointer;}
    .main{flex:1;display:flex;flex-direction:column;background:white;}
    .header{display:flex;align-items:center;gap:12px;padding:12px 20px;border-bottom:1px solid #ddd;}
    .hamburger{font-size:28px;background:none;border:none;cursor:pointer;padding:0 8px;}
    .title{font-weight:bold;font-size:18px;flex:1;}
    .ai-selector{background:#f1f5f9;border:none;padding:6px 12px;border-radius:40px;}
    .conversation{flex:1;overflow-y:auto;padding:20px;display:flex;flex-direction:column;gap:12px;}
    .message{padding:10px 14px;border-radius:18px;max-width:85%;}
    .user{background:#3b82f6;color:white;align-self:flex-end;}
    .ai{background:#f1f5f9;color:#0f172a;align-self:flex-start;}
    .input-bar{display:flex;gap:8px;padding:12px 20px;border-top:1px solid #ddd;background:white;}
    .input-bar input{flex:1;padding:10px;border:1px solid #ccc;border-radius:40px;}
    .input-bar button{background:#3b82f6;color:white;border:none;padding:8px 20px;border-radius:40px;cursor:pointer;}
    .approval-card{background:#fffbeb;border-left:4px solid #f59e0b;padding:12px;margin:8px 0;border-radius:10px;}
    .approval-card pre{background:#fef3c7;padding:8px;border-radius:8px;white-space:pre-wrap;}
    .card-buttons{display:flex;gap:8px;margin-top:8px;}
    .card-buttons button{padding:4px 12px;border-radius:20px;border:none;cursor:pointer;}
    .execute{background:#10b981;color:white;}
    .cancel{background:#e2e8f0;}
    .inline-panel{background:white;border:1px solid #e2e8f0;border-radius:16px;padding:16px;margin-bottom:16px;}
    .inline-panel input,.inline-panel textarea{width:100%;margin:8px 0;padding:8px;border-radius:12px;border:1px solid #ccc;}
  </style>
</head>
<body>
<div id="debug">🔍 [DEBUG] Loading Mission Runner...<br></div>

<div class="overlay" id="overlay"></div>
<div class="sidebar" id="sidebar">
  <h3>⚙️ Mission Runner</h3>
  <button id="btn-settings">🔑 Settings (API Keys)</button>
  <button id="btn-projects">📁 Projects</button>
  <button id="btn-manual">📝 Manual Executor</button>
  <button id="btn-history">📜 History</button>
  <button id="btn-update">🔄 Self-Update</button>
  <button id="btn-close">✖ Close</button>
</div>

<div class="main">
  <div class="header">
    <button class="hamburger" id="hamburger">☰</button>
    <div class="title">Mission Runner v11</div>
    <select id="aiSelector" class="ai-selector">
      <option value="deepseek">DeepSeek</option>
      <option value="claude">Claude</option>
      <option value="gemini">Gemini</option>
    </select>
  </div>
  <div class="conversation" id="conversation"></div>
  <div class="input-bar">
    <input type="text" id="messageInput" placeholder="Ask AI or paste response with ```action-steps...">
    <button id="sendBtn">Send</button>
  </div>
</div>

<script>
  (function(){
    const debugDiv = document.getElementById('debug');
    function debugLog(msg, isErr){
      const line = document.createElement('div');
      line.textContent = `[${new Date().toLocaleTimeString()}] ${msg}`;
      if(isErr) line.style.color = '#ff9999';
      debugDiv.appendChild(line);
      debugDiv.scrollTop = debugDiv.scrollHeight;
      console.log(msg);
    }
    window.debugLog = debugLog;
    debugLog('Script started');

    const sidebar = document.getElementById('sidebar');
    const overlay = document.getElementById('overlay');
    const hamburger = document.getElementById('hamburger');
    const conversation = document.getElementById('conversation');
    const messageInput = document.getElementById('messageInput');
    const sendBtn = document.getElementById('sendBtn');
    const aiSelector = document.getElementById('aiSelector');

    let settings = { apiKeys: { deepseek: '', claude: '', gemini: '' }, activeProject: 'gahiz' };
    function loadSettings() {
      const saved = localStorage.getItem('mr_settings');
      if(saved) {
        try { settings = { ...settings, ...JSON.parse(saved) }; } catch(e) { debugLog('Error parsing settings', true); }
      }
      debugLog('Settings loaded');
    }
    function saveSettings() { localStorage.setItem('mr_settings', JSON.stringify(settings)); debugLog('Settings saved'); }
    loadSettings();

    let history = [];
    function loadHistory() { const h = localStorage.getItem('mr_history'); if(h) { try { history = JSON.parse(h); } catch(e) {} } }
    function saveHistory() { localStorage.setItem('mr_history', JSON.stringify(history.slice(-100))); }
    loadHistory();

    function addMessage(text, sender) {
      const div = document.createElement('div');
      div.className = `message ${sender === 'user' ? 'user' : 'ai'}`;
      div.innerHTML = text.replace(/\n/g, '<br>');
      conversation.appendChild(div);
      conversation.scrollTop = conversation.scrollHeight;
      history.push({ role: sender, content: text, time: Date.now() });
      saveHistory();
    }

    function extractMissions(text) {
      const regex = /```action-steps\s*([\s\S]*?)```/gi;
      let match;
      while ((match = regex.exec(text)) !== null) {
        const steps = match[1].trim();
        if(!steps) continue;
        const card = document.createElement('div');
        card.className = 'approval-card';
        card.innerHTML = `<strong>✅ Mission Ready</strong><pre>${escapeHtml(steps)}</pre><div class="card-buttons"><button class="execute">✔ Execute</button><button class="cancel">✖ Cancel</button></div>`;
        conversation.appendChild(card);
        card.querySelector('.execute').onclick = () => {
          addMessage(`✅ Executed:\n${steps.substring(0,200)}`, 'ai');
          card.remove();
        };
        card.querySelector('.cancel').onclick = () => card.remove();
      }
    }
    function escapeHtml(str) { return str.replace(/[&<>]/g, m => m==='&'?'&amp;':m==='<'?'&lt;':'&gt;'); }

    async function callAI(prompt) {
      const selected = aiSelector.value;
      const apiKey = settings.apiKeys[selected];
      if(!apiKey) {
        addMessage(`⚠️ No API key for ${selected}. Open sidebar → Settings to add it.`, 'ai');
        return;
      }
      addMessage(prompt, 'user');
      messageInput.value = '';
      const thinking = document.createElement('div');
      thinking.className = 'message ai';
      thinking.textContent = '✍️ Thinking...';
      conversation.appendChild(thinking);
      conversation.scrollTop = conversation.scrollHeight;
      try {
        let reply = '';
        if(selected === 'deepseek') {
          const res = await fetch('https://api.deepseek.com/v1/chat/completions', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${apiKey}` },
            body: JSON.stringify({ model: 'deepseek-chat', messages: [{ role: 'user', content: prompt }] })
          });
          const data = await res.json();
          reply = data.choices?.[0]?.message?.content || 'No response';
        } else if(selected === 'claude') {
          const res = await fetch('https://api.anthropic.com/v1/messages', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json', 'x-api-key': apiKey, 'anthropic-version': '2023-06-01' },
            body: JSON.stringify({ model: 'claude-3-sonnet-20240229', max_tokens: 1024, messages: [{ role: 'user', content: prompt }] })
          });
          const data = await res.json();
          reply = data.content?.[0]?.text || 'Claude error';
        } else if(selected === 'gemini') {
          const url = `https://generativelanguage.googleapis.com/v1beta/models/gemini-pro:generateContent?key=${apiKey}`;
          const res = await fetch(url, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ contents: [{ parts: [{ text: prompt }] }] })
          });
          const data = await res.json();
          reply = data.candidates?.[0]?.content?.parts?.[0]?.text || 'Gemini error';
        }
        thinking.remove();
        addMessage(reply, 'ai');
        extractMissions(reply);
      } catch(err) {
        thinking.remove();
        addMessage(`❌ API error: ${err.message}`, 'ai');
        debugLog(`API error: ${err.message}`, true);
      }
    }

    function showInlinePanel(title, contentHtml, onSave) {
      const existing = document.querySelector('.inline-panel');
      if(existing) existing.remove();
      const panel = document.createElement('div');
      panel.className = 'inline-panel';
      panel.innerHTML = `<h3>${title}</h3>${contentHtml}<div style="margin-top:12px;"><button class="save-panel">Save</button> <button class="close-panel">Cancel</button></div>`;
      conversation.insertBefore(panel, conversation.firstChild);
      panel.querySelector('.close-panel').onclick = () => panel.remove();
      const saveBtn = panel.querySelector('.save-panel');
      if(onSave) saveBtn.onclick = () => { onSave(panel); panel.remove(); };
      else saveBtn.onclick = () => panel.remove();
      return panel;
    }

    function showSettings() {
      const deepVal = settings.apiKeys.deepseek ? '••••••' : '';
      const content = `<label>DeepSeek Key</label><input type="password" id="deepKey" placeholder="sk-..." value="${deepVal}"><label>Claude Key</label><input type="password" id="claudeKey" placeholder="sk-ant-..."><label>Gemini Key</label><input type="password" id="geminiKey" placeholder="AIza...">`;
      showInlinePanel('🔑 Settings', content, (panel) => {
        const d = panel.querySelector('#deepKey').value.trim();
        if(d) settings.apiKeys.deepseek = d;
        const c = panel.querySelector('#claudeKey').value.trim();
        if(c) settings.apiKeys.claude = c;
        const g = panel.querySelector('#geminiKey').value.trim();
        if(g) settings.apiKeys.gemini = g;
        saveSettings();
        addMessage('✅ API keys saved.', 'ai');
      });
    }

    function showProjects() {
      const content = `<select id="projSelect"><option value="gahiz">Gahiz (BPO interviews)</option><option value="contentfactory">Content Factory</option><option value="wiredleader">Wired Leader (ADHD)</option></select>`;
      showInlinePanel('📁 Projects', content, (panel) => {
        settings.activeProject = panel.querySelector('#projSelect').value;
        saveSettings();
        addMessage(`Switched to project: ${settings.activeProject}`, 'ai');
      });
    }

    function showManualExecutor() {
      const content = `<textarea id="manualSteps" rows="4" placeholder="Paste text with ```action-steps blocks..."></textarea>`;
      showInlinePanel('📝 Manual Executor', content, (panel) => {
        const text = panel.querySelector('#manualSteps').value;
        if(text) extractMissions(text);
      });
    }

    function showHistory() {
      let html = '<div style="max-height:200px;overflow-y:auto;">';
      history.slice().reverse().forEach(h => {
        html += `<div><strong>${h.role}:</strong> ${h.content.substring(0,100)}...</div>`;
      });
      html += '</div><button id="clearHistoryBtn" style="margin-top:8px;">Clear History</button>';
      const panel = showInlinePanel('📜 History', html);
      panel.querySelector('#clearHistoryBtn').onclick = () => {
        history = [];
        saveHistory();
        addMessage('History cleared', 'ai');
        panel.remove();
      };
    }

    async function selfUpdate() {
      const defaultUrl = 'https://raw.githubusercontent.com/madnessgate44-debug/Mission-runner/main/index.html';
      const url = prompt('Enter raw GitHub URL of new index.html (or press OK for default):', defaultUrl);
      if(!url) return;
      debugLog(`Fetching update from ${url}`);
      addMessage(`⏳ Updating from ${url}...`, 'ai');
      try {
        const res = await fetch(url);
        if(!res.ok) throw new Error(`HTTP ${res.status}`);
        const html = await res.text();
        if(!html.includes('<!DOCTYPE html>') || !html.includes('</html>')) throw new Error('Invalid HTML');
        debugLog('Update fetched, applying...');
        document.open();
        document.write(html);
        document.close();
      } catch(err) {
        addMessage(`❌ Update failed: ${err.message}`, 'ai');
        debugLog(`Update error: ${err.message}`, true);
      }
    }

    function closeSidebar() { sidebar.classList.remove('open'); overlay.classList.remove('open'); }
    function openSidebar() { sidebar.classList.add('open'); overlay.classList.add('open'); }
    hamburger.onclick = openSidebar;
    overlay.onclick = closeSidebar;
    document.getElementById('btn-close').onclick = closeSidebar;
    document.getElementById('btn-settings').onclick = () => { closeSidebar(); showSettings(); };
    document.getElementById('btn-projects').onclick = () => { closeSidebar(); showProjects(); };
    document.getElementById('btn-manual').onclick = () => { closeSidebar(); showManualExecutor(); };
    document.getElementById('btn-history').onclick = () => { closeSidebar(); showHistory(); };
    document.getElementById('btn-update').onclick = () => { closeSidebar(); selfUpdate(); };

    sendBtn.onclick = () => {
      const msg = messageInput.value.trim();
      if(msg) callAI(msg);
    };
    messageInput.addEventListener('keypress', (e) => { if(e.key === 'Enter') sendBtn.click(); });

    addMessage('✅ Mission Runner v11 stable loaded. Open sidebar (☰) → Settings to add your DeepSeek API key. Then ask anything. Paste responses with ```action-steps to see approval cards.', 'ai');
    debugLog('Initialization complete');
  })();
</script>
</body>
</html>
