<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mission Runner v7 · Sidebar</title>
  <style>
    *{margin:0;padding:0;box-sizing:border-box;}
    body{font-family:system-ui;background:#f7f9fc;height:100vh;overflow:hidden;}
    .app{display:flex;height:100%;position:relative;}
    /* Sidebar */
    .sidebar{position:fixed;top:0;left:-280px;width:280px;height:100%;background:#0f172a;color:#e2e8f0;transition:left 0.2s;z-index:1000;padding:20px;display:flex;flex-direction:column;gap:8px;}
    .sidebar.open{left:0;}
    .overlay{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,0.5);z-index:999;display:none;}
    .overlay.open{display:block;}
    .sidebar button{background:#1e293b;border:none;color:white;padding:10px;border-radius:12px;text-align:left;cursor:pointer;}
    /* Main */
    .main{flex:1;display:flex;flex-direction:column;background:white;}
    .header{display:flex;align-items:center;gap:12px;padding:12px 20px;border-bottom:1px solid #e2e8f0;}
    .hamburger{font-size:28px;background:none;border:none;cursor:pointer;padding:0 8px;}
    .title{font-weight:600;font-size:1.2rem;flex:1;}
    .content{flex:1;display:flex;align-items:center;justify-content:center;color:#64748b;}
  </style>
</head>
<body>
<div class="overlay" id="overlay"></div>
<div class="sidebar" id="sidebar">
  <h3>⚙️ Mission Runner</h3>
  <button id="btn-close">✖ Close Sidebar</button>
  <button disabled style="opacity:0.5;">🔑 Settings (coming)</button>
  <button disabled style="opacity:0.5;">📁 Projects (coming)</button>
</div>
<div class="main">
  <div class="header">
    <button class="hamburger" id="hamburger">☰</button>
    <div class="title">Mission Runner v7</div>
  </div>
  <div class="content">
    <p>✅ Sidebar works. Tap ☰ to open.<br>Next step: chat area.</p>
  </div>
</div>
<script>
  const sidebar = document.getElementById('sidebar');
  const overlay = document.getElementById('overlay');
  const hamburger = document.getElementById('hamburger');
  const closeBtn = document.getElementById('btn-close');

  function openSidebar() { sidebar.classList.add('open'); overlay.classList.add('open'); }
  function closeSidebar() { sidebar.classList.remove('open'); overlay.classList.remove('open'); }

  hamburger.onclick = openSidebar;
  overlay.onclick = closeSidebar;
  closeBtn.onclick = closeSidebar;
</script>
</body>
</html>
