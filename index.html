<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Mission Runner v11 · AI Supervisor</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600&display=swap" rel="stylesheet">
  <style>
    *{margin:0;padding:0;box-sizing:border-box;}
    body{font-family:'Inter',system-ui;background:#f7f9fc;height:100vh;overflow:hidden;}
    .app{display:flex;height:100%;position:relative;}
    /* Sidebar */
    .sidebar{position:fixed;top:0;left:-280px;width:280px;height:100%;background:#0f172a;color:#e2e8f0;transition:left 0.2s;z-index:1000;display:flex;flex-direction:column;overflow-y:auto;padding:20px;}
    .sidebar.open{left:0;}
    .overlay{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,0.5);z-index:999;display:none;}
    .overlay.open{display:block;}
    .sidebar h3{margin-bottom:20px;font-size:1.3rem;}
    .nav-item{padding:10px;cursor:pointer;border-radius:12px;margin:4px 0;}
    .nav-item:hover{background:#1e293b;}
    /* Main */
    .main{flex:1;display:flex;flex-direction:column;background:#ffffff;}
    .header{display:flex;align-items:center;gap:12px;padding:12px 20px;border-bottom:1px solid #e2e8f0;}
    .hamburger{font-size:26px;background:none;border:none;cursor:pointer;width:40px;}
    .title{font-weight:600;font-size:1.2rem;flex:1;}
    .ai-selector{background:#f1f5f9;border:none;padding:6px 12px;border-radius:40px;}
    .conversation{flex:1;overflow-y:auto;padding:20px;display:flex;flex-direction:column;gap:12px;}
    .message{padding:10px 16px;border-radius:20px;max-width:80%;}
    .user-message{background:#3b82f6;color:white;align-self:flex-end;}
    .ai-message{background:#f1f5f9;color:#0f172a;align-self:flex-start;}
    .approval-card{background:#fffbeb;border-left:4px solid #f59e0b;border-radius:12px;padding:12px;margin:8px 0;}
    .approval-card pre{background:#fef3c7;padding:8px;border-radius:8px;white-space:pre-wrap;}
    .card-buttons{display:flex;gap:8px;margin-top:8px;}
    .card-buttons button{padding:4px 12px;border-radius:30px;border:none;cursor:pointer;}
    .execute{background:#10b981;color:white;}
    .cancel{background:#e2e8f0;}
    .input-bar{padding:12px 20px;border-top:1px solid #e2e8f0;display:flex;gap:12px;background:white;}
    .input-field{flex:1;padding:10px 16px;border:1px solid #cbd5e1;border-radius:40px;}
    .send-btn{background:#3b82f6;color:white;border:none;padding:8px 24px;border-radius:40px;cursor:pointer;}
    .inline-panel{background:white;border-radius:20px;padding:16px;margin-bottom:16px;border:1px solid #e2e8f0;}
    .inline-panel input,.inline-panel textarea{width:100%;margin:8px 0;padding:8px;border-radius:12px;border:1px solid #ccc;}
  </style>
</head>
<body>
<div class="overlay" id="overlay"></div>
<div class="sidebar" id="sidebar">
  <h3>⚙️ Mission Runner</h3>
  <div class="nav-item" data-panel="settings">⚡ Settings (API Keys)</div>
  <div class="nav-item" data-panel="projects">📁 Projects</div>
  <div class="nav-item" data-panel="executor">📝 Manual Executor</div>
  <div class="nav-item" data-panel="history">📜 History</div>
  <div class="nav-item" data-panel="selfupdate">🔄 Self-Update</div>
  <div class="nav-item" data-panel="close">✖ Close</div>
</div>
<div class="main">
  <div class="header">
    <button class="hamburger" id="hamburger">☰</button>
    <div class="title">Mission Runner v11</div>
    <select id="aiSelector" class="ai-selector"><option value="deepseek">DeepSeek</option><option value="claude">Claude</option><option value="gemini">Gemini</option></select>
  </div>
  <div class="conversation" id="conversation"></div>
  <div class="input-bar">
    <input type="text" id="messageInput" class="input-field" placeholder="Ask AI or paste response with ```action-steps">
    <button class="send-btn" id="sendBtn">Send</button>
  </div>
</div>
<script>
  // ---- DOM elements ----
  const sidebar=document.getElementById('sidebar'), overlay=document.getElementById('overlay'), hamburger=document.getElementById('hamburger');
  const conversation=document.getElementById('conversation'), msgInput=document.getElementById('messageInput'), sendBtn=document.getElementById('sendBtn');
  const aiSelector=document.getElementById('aiSelector');
  // ---- State ----
  let settings={apiKeys:{deepseek:'',claude:'',gemini:''}, activeProject:'gahiz'};
  function load(){const s=localStorage.getItem('mrSettings');if(s)settings={...settings,...JSON.parse(s)};}
  function save(){localStorage.setItem('mrSettings',JSON.stringify(settings));}
  load();
  // ---- UI helpers ----
  function addMessage(text,sender){
    const div=document.createElement('div');div.className=`message ${sender==='user'?'user-message':'ai-message'}`;
    div.innerHTML=text.replace(/\n/g,'<br>');conversation.appendChild(div);conversation.scrollTop=conversation.scrollHeight;
  }
  function extractMissions(text){
    const regex=/```action-steps\s*([\s\S]*?)```/gi; let m;
    while((m=regex.exec(text))!==null){
      const steps=m[1].trim(); if(!steps)continue;
      const card=document.createElement('div');card.className='approval-card';
      card.innerHTML=`<strong>✅ Mission</strong><pre>${escapeHtml(steps)}</pre><div class="card-buttons"><button class="execute">Execute</button><button class="cancel">Cancel</button></div>`;
      conversation.appendChild(card);
      card.querySelector('.execute').onclick=()=>{addMessage(`Executed: ${steps.substring(0,200)}`,'ai');card.remove();};
      card.querySelector('.cancel').onclick=()=>card.remove();
    }
  }
  function escapeHtml(s){return s.replace(/[&<>]/g,function(m){if(m==='&')return'&amp;';if(m==='<')return'&lt;';return'&gt;';});}
  // ---- AI calls ----
  async function callAI(msg){
    const selected=aiSelector.value;
    const key=settings.apiKeys[selected];
    if(!key){addMessage(`⚠️ No API key for ${selected}. Go to Settings (sidebar) to add it.`,'ai');return;}
    addMessage(msg,'user'); msgInput.value='';
    const thinking=document.createElement('div');thinking.className='message ai-message';thinking.textContent='✍️ Thinking...';
    conversation.appendChild(thinking);conversation.scrollTop=conversation.scrollHeight;
    try{
      let reply='';
      if(selected==='deepseek'){
        const res=await fetch('https://api.deepseek.com/v1/chat/completions',{method:'POST',headers:{'Content-Type':'application/json','Authorization':`Bearer ${key}`},body:JSON.stringify({model:'deepseek-chat',messages:[{role:'user',content:msg}]})});
        const data=await res.json(); reply=data.choices?.[0]?.message?.content||'No response';
      } else if(selected==='claude'){
        const res=await fetch('https://api.anthropic.com/v1/messages',{method:'POST',headers:{'Content-Type':'application/json','x-api-key':key,'anthropic-version':'2023-06-01'},body:JSON.stringify({model:'claude-3-sonnet-20240229',max_tokens:1024,messages:[{role:'user',content:msg}]})});
        const data=await res.json(); reply=data.content?.[0]?.text||'Empty';
      } else if(selected==='gemini'){
        const res=await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-pro:generateContent?key=${key}`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({contents:[{parts:[{text:msg}]}]})});
        const data=await res.json(); reply=data.candidates?.[0]?.content?.parts?.[0]?.text||'Error';
      }
      thinking.remove(); addMessage(reply,'ai'); extractMissions(reply);
    }catch(e){thinking.remove(); addMessage(`❌ API error: ${e.message}`,'ai');}
  }
  // ---- Inline panels ----
  function showInlinePanel(title,contentHtml){
    const old=document.querySelector('.inline-panel');if(old)old.remove();
    const panel=document.createElement('div');panel.className='inline-panel';
    panel.innerHTML=`<h3>${title}</h3>${contentHtml}<div style="margin-top:12px;"><button class="save-panel">Save</button> <button class="close-panel">Close</button></div>`;
    conversation.insertBefore(panel,conversation.firstChild);
    const close=panel.querySelector('.close-panel');close.onclick=()=>panel.remove();
    return panel;
  }
  function showSettings(){
    const deepStar=settings.apiKeys.deepseek?'••••••':'';
    const content=`<label>DeepSeek Key</label><input type="password" id="deepKey" placeholder="sk-..." value="${deepStar}"><label>Claude Key</label><input type="password" id="claudeKey" placeholder="sk-ant-..."><label>Gemini Key</label><input type="password" id="geminiKey" placeholder="AIza...">`;
    const panel=showInlinePanel('⚙️ Settings',content);
    panel.querySelector('.save-panel').onclick=()=>{
      const d=panel.querySelector('#deepKey').value.trim();if(d)settings.apiKeys.deepseek=d;
      const c=panel.querySelector('#claudeKey').value.trim();if(c)settings.apiKeys.claude=c;
      const g=panel.querySelector('#geminiKey').value.trim();if(g)settings.apiKeys.gemini=g;
      save(); addMessage('Settings saved.','ai'); panel.remove();
    };
  }
  function showProjects(){
    const content=`<select id="projSelect"><option value="gahiz">Gahiz (BPO interviews)</option><option value="contentfactory">Content Factory</option><option value="wiredleader">Wired Leader (ADHD)</option></select>`;
    const panel=showInlinePanel('📁 Projects',content);
    panel.querySelector('#projSelect').value=settings.activeProject;
    panel.querySelector('.save-panel').onclick=()=>{settings.activeProject=panel.querySelector('#projSelect').value;save();addMessage(`Switched to ${settings.activeProject}`,'ai');panel.remove();};
  }
  function showManualExecutor(){
    const content=`<textarea id="manualSteps" rows="4" placeholder="Paste text with ```action-steps"></textarea>`;
    const panel=showInlinePanel('📝 Manual Executor',content);
    panel.querySelector('.save-panel').onclick=()=>{const t=panel.querySelector('#manualSteps').value;if(t)extractMissions(t);panel.remove();};
  }
  function showHistory(){
    const stored=localStorage.getItem('mrHistory'); let items=[];
    try{if(stored)items=JSON.parse(stored);}catch(e){}
    let html='<div style="max-height:200px;overflow-y:auto;">';
    items.slice().reverse().forEach(m=>html+=`<div><strong>${m.role}:</strong> ${m.content.substring(0,100)}...</div>`);
    html+='</div><button id="clearHistory">Clear History</button>';
    const panel=showInlinePanel('📜 History',html);
    panel.querySelector('#clearHistory').onclick=()=>{localStorage.removeItem('mrHistory');addMessage('History cleared','ai');panel.remove();};
    panel.querySelector('.save-panel').onclick=()=>panel.remove();
  }
  function selfUpdate(){
    const url=prompt('Enter raw GitHub URL of new index.html (default: your repo main)','https://raw.githubusercontent.com/madnessgate44-debug/Mission-runner/main/index.html');
    if(!url)return;
    fetch(url).then(r=>r.text()).then(html=>{if(html.includes('<!DOCTYPE html')){document.open();document.write(html);document.close();}else alert('Invalid HTML');}).catch(e=>alert('Update failed: '+e.message));
  }
  // ---- Sidebar ----
  function closeSidebar(){sidebar.classList.remove('open');overlay.classList.remove('open');}
  function openSidebar(){sidebar.classList.add('open');overlay.classList.add('open');}
  hamburger.onclick=openSidebar; overlay.onclick=closeSidebar;
  document.querySelectorAll('.nav-item').forEach(item=>{
    item.addEventListener('click',()=>{
      const action=item.dataset.panel; closeSidebar();
      if(action==='settings')showSettings();
      else if(action==='projects')showProjects();
      else if(action==='executor')showManualExecutor();
      else if(action==='history')showHistory();
      else if(action==='selfupdate')selfUpdate();
      else if(action==='close')closeSidebar();
    });
  });
  sendBtn.onclick=()=>{const m=msgInput.value.trim();if(m)callAI(m);};
  msgInput.addEventListener('keypress',e=>{if(e.key==='Enter')sendBtn.click();});
  addMessage('✅ Mission Runner v11 ready. Use ☰ sidebar to add API keys. Paste any response with ```action-steps to see approval cards.','ai');
  // auto-save conversation history
  function saveHistory(role,content){let h=JSON.parse(localStorage.getItem('mrHistory')||'[]');h.push({role,content,timestamp:Date.now()});if(h.length>100)h=h.slice(-100);localStorage.setItem('mrHistory',JSON.stringify(h));}
  const origAdd=addMessage; window.addMessage=function(t,s){origAdd(t,s);saveHistory(s,t);}; addMessage=window.addMessage;
</script>
</body>
</html>
