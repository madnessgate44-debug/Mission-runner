<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Self-Updater</title>
  <style>
    body{font-family:system-ui;max-width:500px;margin:2rem auto;padding:1rem;}
    textarea, input, button{width:100%;margin:0.5rem 0;padding:0.5rem;}
    button{background:#3b82f6;color:white;border:none;cursor:pointer;}
    .status{margin-top:1rem;padding:0.5rem;background:#e2e8f0;}
  </style>
</head>
<body>
<h1>🔄 Self-Updater</h1>
<p>Update index.html on GitHub. No cache clearing needed.</p>
<input type="password" id="token" placeholder="GitHub token (repo scope)">
<textarea id="code" rows="12" placeholder="Paste full HTML code here"></textarea>
<button id="update">Commit to GitHub</button>
<div id="status" class="status">Ready</div>

<script>
  const owner = 'madnessgate44-debug';
  const repo = 'Mission-runner';
  const path = 'index.html';
  const branch = 'main';

  const tokenInput = document.getElementById('token');
  const codeArea = document.getElementById('code');
  const updateBtn = document.getElementById('update');
  const statusDiv = document.getElementById('status');

  const saved = localStorage.getItem('github_token');
  if (saved) tokenInput.value = saved;

  function setStatus(msg, isErr) {
    statusDiv.innerHTML = msg;
    statusDiv.style.background = isErr ? '#fee2e2' : '#dcfce7';
  }

  updateBtn.onclick = async () => {
    const token = tokenInput.value.trim();
    if (!token) { setStatus('❌ Enter token', true); return; }
    localStorage.setItem('github_token', token);

    const html = codeArea.value;
    if (!html.includes('<!DOCTYPE html>') || !html.includes('</html>')) {
      setStatus('❌ Invalid HTML', true);
      return;
    }

    setStatus('⏳ Updating...');
    try {
      const url = `https://api.github.com/repos/${owner}/${repo}/contents/${path}`;
      const getRes = await fetch(url, { headers: { 'Authorization': `token ${token}` } });
      let sha = null;
      if (getRes.ok) sha = (await getRes.json()).sha;

      const content = btoa(unescape(encodeURIComponent(html)));
      const putRes = await fetch(url, {
        method: 'PUT',
        headers: { 'Authorization': `token ${token}`, 'Content-Type': 'application/json' },
        body: JSON.stringify({ message: 'Self-update', content, sha, branch })
      });
      if (!putRes.ok) throw new Error(await putRes.text());
      setStatus('✅ Updated! Reloading with cache-buster...');
      setTimeout(() => { window.location.href = `/?v=${Date.now()}`; }, 1500);
    } catch (err) {
      setStatus(`❌ ${err.message}`, true);
    }
  };
</script>
</body>
</html>
