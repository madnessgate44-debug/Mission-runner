<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mission Runner</title>
  <style>
    *{margin:0;padding:0;box-sizing:border-box;}
    body{font-family:system-ui;background:#f4f6fa;height:100vh;display:flex;flex-direction:column;}
    .header{display:flex;align-items:center;gap:12px;padding:12px 20px;background:white;border-bottom:1px solid #ddd;}
    .title{font-weight:600;flex:1;font-size:16px;}
    .repo-badge{font-size:11px;background:#e2e8f0;padding:2px 8px;border-radius:20px;color:#475569;max-width:180px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
    .conversation{flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:10px;}
    .message{padding:10px 14px;border-radius:16px;max-width:85%;font-size:14px;line-height:1.5;word-break:break-word;}
    .user{background:#3b82f6;color:white;align-self:flex-end;}
    .ai{background:white;border:1px solid #e2e8f0;align-self:flex-start;}
    .ai.error{border-color:#fca5a5;background:#fff5f5;}
    .ai.success{border-color:#86efac;background:#f0fdf4;}
    .input-bar{display:flex;gap:8px;padding:12px 16px;background:white;border-top:1px solid #ddd;}
    .input-field{flex:1;padding:10px 14px;border-radius:40px;border:1px solid #ccc;font-size:14px;}
    .send-btn{background:#3b82f6;color:white;border:none;padding:8px 18px;border-radius:40px;cursor:pointer;font-size:14px;}
    .sidebar{position:fixed;top:0;left:-300px;width:300px;height:100%;background:#0f172a;color:white;transition:left 0.2s;z-index:1000;padding:20px;overflow-y:auto;display:flex;flex-direction:column;gap:8px;}
    .sidebar.open{left:0;}
    .overlay{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,0.5);z-index:999;display:none;}
    .overlay.open{display:block;}
    .sidebar h3{margin-bottom:4px;font-size:16px;}
    .sidebar label{font-size:11px;color:#94a3b8;margin-top:6px;display:block;}
    .sidebar input{width:100%;padding:8px 10px;border-radius:10px;border:none;background:#1e293b;color:white;font-size:13px;margin-top:3px;}
    .sidebar button{display:block;width:100%;margin-top:6px;padding:10px;background:#1e293b;border:none;color:white;border-radius:12px;cursor:pointer;font-size:13px;text-align:left;}
    .sidebar button.primary{background:#3b82f6;}
    .sidebar .divider{border:none;border-top:1px solid #1e293b;margin:8px 0;}
    .upload-area{border:2px dashed #334155;border-radius:10px;padding:14px;text-align:center;cursor:pointer;font-size:12px;color:#94a3b8;margin-top:4px;}
    .upload-area.upload-zip{border-color:#3b82f6;background:#1e293b;}
    .file-list{font-size:11px;color:#64748b;margin-top:4px;max-height:70px;overflow-y:auto;}
    .progress-bar{width:100%;height:4px;background:#1e293b;border-radius:2px;margin-top:6px;overflow:hidden;display:none;}
    .progress-bar.active{display:block;}
    .progress-fill{height:100%;background:#3b82f6;transition:width 0.3s;width:0%;}
    .zip-info{font-size:11px;color:#94a3b8;margin-top:4px;}
    .checkbox-label{font-size:11px;color:#94a3b8;display:flex;align-items:center;gap:6px;margin-top:4px;cursor:pointer;}
    .checkbox-label input[type="checkbox"]{width:16px;height:16px;accent-color:#3b82f6;}
  </style>
</head>
<body>

<div class="overlay" id="overlay"></div>
<div class="sidebar" id="sidebar">
  <h3>⚙️ Mission Runner</h3>

  <label>GitHub Token</label>
  <input type="password" id="tokenInput" placeholder="ghp_...">
  <button class="primary" id="saveTokenBtn">💾 Save Token</button>

  <hr class="divider">

  <label>Owner (GitHub username)</label>
  <input type="text" id="ownerInput" placeholder="e.g. madnessgate44-debug">
  <label>Repository name</label>
  <input type="text" id="repoInput" placeholder="e.g. Mazra3a">
  <label>Branch</label>
  <input type="text" id="branchInput" placeholder="main" value="main">
  <button class="primary" id="saveRepoBtn">✅ Save Repo Settings</button>

  <hr class="divider">

  <label>Upload files to repo</label>
  <div class="upload-area" id="uploadArea">📁 Tap to select files<input type="file" id="fileInput" multiple style="display:none;"></div>
  <div class="upload-area upload-zip" id="uploadZipArea">📦 Tap to select a ZIP file<input type="file" id="zipInput" accept=".zip" style="display:none;"></div>
  <div class="file-list" id="fileList"></div>
  <div class="zip-info" id="zipInfo"></div>
  
  <label class="checkbox-label">
    <input type="checkbox" id="cleanDuplicates" checked> 🧹 Clean duplicates (delete existing before upload)
  </label>
  
  <div class="progress-bar" id="progressBar"><div class="progress-fill" id="progressFill"></div></div>
  <button id="uploadBtn">📤 Upload Selected Files</button>
  <button id="uploadZipBtn" style="margin-top:4px;">📦 Upload & Extract ZIP</button>

  <hr class="divider">

  <button id="triggerBuildBtn">🔨 Trigger Build</button>
  <button id="checkStatusBtn">📊 Check Build Status</button>

  <hr class="divider">
  <button id="closeSidebarBtn">✖ Close</button>
</div>

<div style="flex:1;display:flex;flex-direction:column;">
  <div class="header">
    <button id="menuBtn" style="background:none;border:none;font-size:22px;cursor:pointer;">☰</button>
    <div class="title">Mission Runner</div>
    <div class="repo-badge" id="repoBadge">No repo set</div>
  </div>
  <div class="conversation" id="conversation">
    <div class="message ai">👋 Open ☰ sidebar → set your token and repo → then upload files or paste action-steps.</div>
  </div>
  <div class="input-bar">
    <input class="input-field" id="messageInput" placeholder="Paste ```action-steps block...">
    <button class="send-btn" id="sendBtn">Send</button>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<script>
  let githubToken = localStorage.getItem("mr_token") || "";
  let owner  = localStorage.getItem("mr_owner")  || "";
  let repo   = localStorage.getItem("mr_repo")   || "";
  let branch = localStorage.getItem("mr_branch") || "main";
  let selectedFiles = [];
  let zipFile = null;

  const conversation = document.getElementById("conversation");
  const messageInput = document.getElementById("messageInput");
  const repoBadge    = document.getElementById("repoBadge");
  const sidebar      = document.getElementById("sidebar");
  const overlay      = document.getElementById("overlay");
  const tokenInput   = document.getElementById("tokenInput");
  const ownerInput   = document.getElementById("ownerInput");
  const repoInput    = document.getElementById("repoInput");
  const branchInput  = document.getElementById("branchInput");
  const fileInput    = document.getElementById("fileInput");
  const zipInput     = document.getElementById("zipInput");
  const fileList     = document.getElementById("fileList");
  const zipInfo      = document.getElementById("zipInfo");
  const progressBar  = document.getElementById("progressBar");
  const progressFill = document.getElementById("progressFill");
  const cleanDuplicates = document.getElementById("cleanDuplicates");

  if (githubToken) tokenInput.value = githubToken;
  if (owner)  ownerInput.value  = owner;
  if (repo)   repoInput.value   = repo;
  if (branch) branchInput.value = branch;
  updateBadge();

  function addMsg(html, type) {
    const d = document.createElement("div");
    d.className = "message ai" + (type ? " " + type : "");
    d.innerHTML = html.replace(/\n/g,"<br>");
    conversation.appendChild(d);
    d.scrollIntoView({behavior:"smooth"});
  }

  function updateBadge() {
    repoBadge.textContent = (owner && repo) ? owner+"/"+repo : "No repo set";
  }

  function openSidebar()  { sidebar.classList.add("open");    overlay.classList.add("open"); }
  function closeSidebar() { sidebar.classList.remove("open"); overlay.classList.remove("open"); }
  document.getElementById("menuBtn").onclick = openSidebar;
  overlay.onclick = closeSidebar;
  document.getElementById("closeSidebarBtn").onclick = closeSidebar;

  document.getElementById("saveTokenBtn").onclick = () => {
    const t = tokenInput.value.trim();
    if (t.length < 10) { addMsg("❌ Token too short.","error"); return; }
    githubToken = t;
    localStorage.setItem("mr_token", t);
    addMsg("✅ Token saved.","success");
    closeSidebar();
  };

  document.getElementById("saveRepoBtn").onclick = () => {
    owner  = ownerInput.value.trim();
    repo   = repoInput.value.trim();
    branch = branchInput.value.trim() || "main";
    if (!owner || !repo) { addMsg("❌ Owner and repo required.","error"); return; }
    localStorage.setItem("mr_owner",  owner);
    localStorage.setItem("mr_repo",   repo);
    localStorage.setItem("mr_branch", branch);
    updateBadge();
    addMsg("✅ Repo set to <b>"+owner+"/"+repo+"</b> (branch: "+branch+")","success");
    closeSidebar();
  };

  async function ghReq(path, method, body) {
    const url = "https://api.github.com/repos/"+owner+"/"+repo+path;
    const h = { Authorization:"token "+githubToken, Accept:"application/vnd.github.v3+json" };
    if (body) h["Content-Type"] = "application/json";
    const r = await fetch(url, {method:method||"GET", headers:h, body:body?JSON.stringify(body):undefined});
    const txt = await r.text();
    if (!r.ok) throw new Error(txt);
    return txt ? JSON.parse(txt) : {};
  }

  function b64(str) { return btoa(unescape(encodeURIComponent(str))); }
  function unb64(str) { return decodeURIComponent(escape(atob(str.replace(/\n/g,"")))); }

  function readText(file) {
    return new Promise((res,rej) => { const r=new FileReader(); r.onload=e=>res(e.target.result); r.onerror=rej; r.readAsText(file); });
  }
  function readB64(file) {
    return new Promise((res,rej) => { const r=new FileReader(); r.onload=e=>res(e.target.result.split(",")[1]); r.onerror=rej; r.readAsDataURL(file); });
  }

  // Check if file exists in repo
  async function fileExists(path) {
    try {
      await ghReq("/contents/"+path);
      return true;
    } catch(e) {
      return false;
    }
  }

  // Delete file from repo
  async function deleteFile(path) {
    try {
      const ex = await ghReq("/contents/"+path);
      await ghReq("/contents/"+path,"DELETE",{message:"Cleanup: delete "+path,sha:ex.sha,branch});
      return true;
    } catch(e) {
      return false;
    }
  }

  // Upload a single file
  async function uploadFile(path, content, isText) {
    let sha = null;
    try { sha = (await ghReq("/contents/"+path)).sha; } catch(e){}
    const contentB64 = isText ? b64(content) : content;
    await ghReq("/contents/"+path,"PUT",{message:"Upload "+path,content:contentB64,sha,branch});
  }

  document.getElementById("uploadArea").onclick = () => fileInput.click();
  fileInput.onchange = () => {
    selectedFiles = Array.from(fileInput.files);
    fileList.innerHTML = selectedFiles.map(f=>"<div>📄 "+f.name+" ("+Math.round(f.size/1024)+"kb)</div>").join("");
    zipFile = null;
    zipInfo.textContent = "";
  };

  document.getElementById("uploadZipArea").onclick = () => zipInput.click();
  zipInput.onchange = () => {
    zipFile = zipInput.files[0];
    if (zipFile) {
      zipInfo.textContent = "📦 ZIP loaded: "+zipFile.name+" ("+Math.round(zipFile.size/1024)+"kb)";
      selectedFiles = [];
      fileList.innerHTML = "";
    }
  };

  document.getElementById("uploadBtn").onclick = async () => {
    if (!githubToken) { addMsg("❌ Save token first.","error"); return; }
    if (!owner||!repo) { addMsg("❌ Save repo settings first.","error"); return; }
    if (!selectedFiles.length) { addMsg("❌ No files selected.","error"); return; }
    closeSidebar();
    await uploadFilesToRepo(selectedFiles, false);
  };

  document.getElementById("uploadZipBtn").onclick = async () => {
    if (!githubToken) { addMsg("❌ Save token first.","error"); return; }
    if (!owner||!repo) { addMsg("❌ Save repo settings first.","error"); return; }
    if (!zipFile) { addMsg("❌ No ZIP file selected.","error"); return; }
    closeSidebar();
    
    try {
      addMsg("📦 Extracting ZIP: "+zipFile.name+"...");
      const zip = await JSZip.loadAsync(zipFile);
      const files = [];
      
      for (const [path, file] of Object.entries(zip.files)) {
        // Skip directories and files with undefined path
        if (!file.dir && path && path.trim() !== "") {
          try {
            const content = await file.async("string");
            // Determine if file is text based on extension
            const isText = /\.(kt|xml|gradle|kts|toml|md|json|txt|yml|yaml|properties|java|js|html|css|gitignore|env|pro|sh|bat|cmd|conf|config|ini|cfg|xml|xsd|dtd|ent|key|pem|crt|csr|pub|asc|gpg|sig|asc|md|markdown|rst|tex|bib|sty|cls|bst|bst|bib|bbx|cbx|dbx|lbx|bbx|cbx|dbx|lbx)$/i.test(path);
            files.push({path, content, isText});
          } catch(e) {
            console.warn("Failed to read file:", path, e);
          }
        }
      }
      
      if (files.length === 0) {
        addMsg("❌ No valid files found in ZIP.","error");
        return;
      }
      
      addMsg("📦 Found "+files.length+" files in ZIP");
      await uploadFilesToRepo(files, true);
    } catch(e) {
      addMsg("❌ Error extracting ZIP: "+e.message,"error");
      console.error(e);
    }
  };

  async function uploadFilesToRepo(files, isZip) {
    let fileList = files;
    if (!isZip) {
      // Convert File objects to our format
      fileList = [];
      for (const file of files) {
        const path = file.webkitRelativePath || file.name;
        if (path && path.trim() !== "") {
          const isText = /\.(kt|xml|gradle|kts|toml|md|json|txt|yml|yaml|properties|java|js|html|css|gitignore|env|pro|sh|bat|cmd|conf|config|ini|cfg|xml|xsd|dtd|ent|key|pem|crt|csr|pub|asc|gpg|sig|asc|md|markdown|rst|tex|bib|sty|cls|bst|bst|bib|bbx|cbx|dbx|lbx|bbx|cbx|dbx|lbx)$/i.test(path);
          const content = isText ? await readText(file) : await readB64(file);
          fileList.push({path, content, isText});
        }
      }
    }

    if (!fileList.length) { addMsg("❌ No files to upload.","error"); return; }
    
    addMsg("🚀 Processing "+fileList.length+" file(s) on <b>"+owner+"/"+repo+"</b>...");
    progressBar.classList.add("active");
    
    let uploaded=0, deleted=0, errors=[];
    const paths = fileList.map(f => f.path).filter(p => p && p.trim() !== "");
    
    // Clean duplicates if enabled
    if (cleanDuplicates.checked) {
      addMsg("🧹 Checking for duplicates...");
      for (const path of paths) {
        try {
          if (await fileExists(path)) {
            await deleteFile(path);
            deleted++;
          }
        } catch(e) {
          errors.push("Cleanup failed for "+path+": "+e.message.slice(0,100));
        }
      }
      if (deleted > 0) addMsg("🧹 Deleted "+deleted+" existing file(s)","success");
    }
    
    // Upload files
    for (let i = 0; i < fileList.length; i++) {
      try {
        const {path, content, isText} = fileList[i];
        if (path && path.trim() !== "") {
          await uploadFile(path, content, isText);
          uploaded++;
        }
        progressFill.style.width = Math.round((i+1)/fileList.length*100)+"%";
      } catch(e) {
        errors.push((fileList[i].path || "unknown")+": "+e.message.slice(0,120));
      }
    }
    
    progressBar.classList.remove("active");
    progressFill.style.width="0%";
    
    // Clear selections
    selectedFiles = [];
    fileList.innerHTML = "";
    zipFile = null;
    zipInfo.textContent = "";
    fileInput.value = "";
    zipInput.value = "";
    
    if (!errors.length) {
      addMsg("✅ Uploaded "+uploaded+" file(s)"+(deleted>0?" (deleted "+deleted+" duplicates)":"")+"!","success");
    } else {
      addMsg("⚠️ "+uploaded+" uploaded, "+errors.length+" failed:\n"+errors.slice(0,5).join("\n"),"error");
    }
  }

  document.getElementById("triggerBuildBtn").onclick = async () => {
    if (!githubToken||!owner||!repo) { addMsg("❌ Set token and repo first.","error"); return; }
    closeSidebar();
    try {
      const wfs = await ghReq("/actions/workflows");
      if (!wfs.workflows||!wfs.workflows.length) { addMsg("❌ No workflows found. Upload build.yml first.","error"); return; }
      const wf = wfs.workflows[0];
      await ghReq("/actions/workflows/"+wf.id+"/dispatches","POST",{ref:branch});
      addMsg("🔨 Build triggered! (<b>"+wf.name+"</b>)\nWatch: github.com/"+owner+"/"+repo+"/actions","success");
    } catch(e) { addMsg("❌ "+e.message.slice(0,300),"error"); }
  };

  document.getElementById("checkStatusBtn").onclick = async () => {
    if (!githubToken||!owner||!repo) { addMsg("❌ Set token and repo first.","error"); return; }
    closeSidebar();
    try {
      const runs = await ghReq("/actions/runs?per_page=5");
      if (!runs.workflow_runs||!runs.workflow_runs.length) { addMsg("No builds found yet."); return; }
      const lines = runs.workflow_runs.slice(0,5).map(r=>{
        const icon = r.conclusion==="success"?"✅":r.conclusion==="failure"?"❌":r.status==="in_progress"?"🔄":"⏳";
        return icon+" "+r.name+" — "+(r.conclusion||r.status)+" ("+new Date(r.created_at).toLocaleString()+")";
      });
      addMsg("<b>Last builds on "+owner+"/"+repo+":</b>\n"+lines.join("\n"));
    } catch(e) { addMsg("❌ "+e.message.slice(0,200),"error"); }
  };

  document.getElementById("sendBtn").onclick = async () => {
    const msg = messageInput.value.trim();
    if (!msg) return;
    const ud = document.createElement("div");
    ud.className="message user"; ud.textContent=msg.slice(0,200)+(msg.length>200?"...":"");
    conversation.appendChild(ud); ud.scrollIntoView({behavior:"smooth"});
    messageInput.value="";
    const match = msg.match(/```action-steps([\s\S]*?)```/);
    if (match) await runSteps(match[1].trim());
    else addMsg("💬 No action-steps block detected.\n\nFormat:\n```action-steps\nCREATE path/file.kt\n[content]\nEND\n```");
  };

  messageInput.addEventListener("keypress", e => { if(e.key==="Enter") document.getElementById("sendBtn").click(); });

  async function runSteps(text) {
    if (!githubToken) { addMsg("❌ No token.","error"); return; }
    if (!owner||!repo) { addMsg("❌ No repo set.","error"); return; }
    const lines = text.split("\n");
    const ops=[]; let i=0;
    while(i<lines.length){
      const line=lines[i].trim();
      if(line.startsWith("CREATE ")){
        const fp=line.slice(7).trim(); const cl=[]; i++;
        while(i<lines.length&&lines[i].trim()!=="END"){cl.push(lines[i]);i++;}
        ops.push({type:"create",path:fp,content:cl.join("\n")});
      } else if(line.startsWith("DELETE ")){
        ops.push({type:"delete",path:line.slice(7).trim()});
      } else if(line.startsWith("REPLACE ")){
        const fp=line.slice(8).trim(); let find="",repl=""; i++;
        while(i<lines.length&&lines[i].trim()!=="END"){
          if(lines[i].startsWith("FIND: ")) find=lines[i].slice(6);
          else if(lines[i].startsWith("WITH: ")) repl=lines[i].slice(6);
          i++;
        }
        ops.push({type:"replace",path:fp,find,with:repl});
      }
      i++;
    }
    if(!ops.length){addMsg("⚠️ No valid operations found."); return;}
    addMsg("🚀 Running "+ops.length+" operation(s) on <b>"+owner+"/"+repo+"</b>...");
    let done=0,errors=[];
    for(const op of ops){
      try{
        if(op.type==="create"){
          let sha=null; try{sha=(await ghReq("/contents/"+op.path)).sha;}catch(e){}
          await ghReq("/contents/"+op.path,"PUT",{message:"Mission Runner: create "+op.path,content:b64(op.content),sha,branch});
          addMsg("✅ Created: "+op.path,"success");
        } else if(op.type==="delete"){
          const ex=await ghReq("/contents/"+op.path);
          await ghReq("/contents/"+op.path,"DELETE",{message:"Mission Runner: delete "+op.path,sha:ex.sha,branch});
          addMsg("🗑️ Deleted: "+op.path,"success");
        } else if(op.type==="replace"){
          const ex=await ghReq("/contents/"+op.path);
          const decoded=unb64(ex.content);
          if(!decoded.includes(op.find)){errors.push(op.path+": FIND text not found");continue;}
          const updated=decoded.replace(op.find,op.with);
          await ghReq("/contents/"+op.path,"PUT",{message:"Mission Runner: update "+op.path,content:b64(updated),sha:ex.sha,branch});
          addMsg("✏️ Updated: "+op.path,"success");
        }
        done++;
      }catch(e){errors.push(op.path+": "+e.message.slice(0,150)); addMsg("❌ Failed: "+op.path,"error");}
    }
    addMsg("Done: "+done+"/"+ops.length+(errors.length?"\n\nErrors:\n"+errors.join("\n"):""),errors.length?"error":"success");
  }
</script>
</body>
</html>
