name: Mission Runner Package 1 CI

on:
  push:
    paths:
      - "package-1-source/**"
      - ".github/workflows/package-1-ci.yml"
  pull_request:
    paths:
      - "package-1-source/**"
      - ".github/workflows/package-1-ci.yml"

jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: package-1-source
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: pnpm install --no-frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm validate:example
