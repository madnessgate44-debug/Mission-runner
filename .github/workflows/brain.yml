name: GitHub Arm

on:
  push:
    paths:
      - ".missions/inbox/*.json"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: github-arm
  cancel-in-progress: false

jobs:
  execute:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout arm
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Execute pending missions
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ARM_GITHUB_TOKEN: ${{ secrets.ARM_GITHUB_TOKEN }}
        run: node scripts/mission.js
      - name: Publish mission results
        if: always()
        run: |
          git config user.name "GitHub Arm"
          git config user.email "github-arm@users.noreply.github.com"
          git add .missions/results .missions/inbox
          git diff --staged --quiet || git commit -m "Arm: publish mission result"
          git push
